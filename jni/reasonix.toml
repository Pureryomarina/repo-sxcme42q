# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.config/reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 2   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
max_steps   = 0
temperature = 0.0
auto_plan   = "off"   # off|on; off keeps plan mode manual
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[codegraph]
enabled      = true   # built-in MCP server; off by default for first-run sessions
auto_install = true   # fetch the runtime when CodeGraph is enabled but missing
# path       = ""   # empty = cache, then PATH, then a bundle beside reasonix

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "ToolName" or "ToolName(glob)"; '*' matches any run, '?' one char.
mode  = "ask"
# deny = ["bash(rm -rf*)", "bash(git push*)"]   # hard-blocked in every mode
allow = ["explore", "edit_file=Protect/ProtectManager.h", "edit_file=src/main.cpp", "multi_edit=Protect/IntegrityCheck.h", "edit_file=Protect/IntegrityCheck.h", "delete_range=Protect/IntegrityCheck.h", "edit_file=do_build.ps1", "edit_file=patch_integrity.ps1", "edit_file=patch_integrity.py", "write_file=src/utils/integrity_sha256.cpp", "edit_file=Android.mk", "write_file=test_sha256.cpp", "bash=where g++ 2>nul & where clang++ 2>nul & where cl 2>nul", "bash=\"C:\\Program Files\\Python310\\python\" -c \"\nimport struct\n\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\ndef ch(x,y,z): return (x&y)^((~x)&z)\ndef maj(x,y,z): return (x&y)^(x&z)^(y&z)\ndef sigma0(x): return rotr(x,2)^rotr(x,13)^rotr(x,22)\ndef sigma1(x): return rotr(x,6)^rotr(x,11)^rotr(x,25)\ndef gamma0(x): return rotr(x,7)^rotr(x,18)^(x>>3)\ndef gamma1(x): return rotr(x,17)^rotr(x,19)^(x>>10)\n\nK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n     0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n     0x49b40821,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,\n     0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,\n     0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,\n     0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,\n     0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,\n     0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7]\n\n# message = 'abc' padded per SHA256 spec\nmsg = bytearray(64)\nmsg[0]=0x61; msg[1]=0x62; msg[2]=0x63; msg[3]=0x80\n# length = 24 bits at end\nmsg[56:64] = struct.pack('>Q', 24)\n\n# W[0..15] from block (big-endian read, exactly like C code)\nw = [0]*64\nfor j in range(16):\n    w[j] = (msg[j*4]<<24)|(msg[j*4+1]<<16)|(msg[j*4+2]<<8)|msg[j*4+3]\nfor j in range(16,64):\n    w[j] = (gamma1(w[j-2]) + w[j-7] + gamma0(w[j-15]) + w[j-16]) & 0xFFFFFFFF\n\na=0x6a09e667; b=0xbb67ae85; c=0x3c6ef372; d=0xa54ff53a\ne=0x510e527f; f=0x9b05688c; g=0x1f83d9ab; h=0x5be0cd19\n\nfor j in range(64):\n    t1 = (h + sigma1(e) + ch(e,f,g) + K[j] + w[j]) & 0xFFFFFFFF\n    t2 = (sigma0(a) + maj(a,b,c)) & 0xFFFFFFFF\n    h=g; g=f; f=e; e=(d+t1)&0xFFFFFFFF\n    d=c; c=b; b=a; a=(t1+t2)&0xFFFFFFFF\n\n# final add\nH = [a,b,c,d,e,f,g,h]\nstate = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]\nresult = [(state[i]+H[i])&0xFFFFFFFF for i in range(8)]\n\nprint('Python SHA256(abc) =', ''.join(f'{x:08X}' for x in result))\nprint('Expected:           BA7816BF8F01CFEA414140DE5DAE2223B00361A396177A9CB410FF61F20015AD')\n\"", "bash=/c/Program\\ Files/Python310/python -c \"import hashlib; print(hashlib.sha256(b'abc').hexdigest().upper())\"", "bash=python3 -c \"import hashlib; print(hashlib.sha256(b'abc').hexdigest().upper())\" 2>/dev/null || python -c \"import hashlib; print(hashlib.sha256(b'abc').hexdigest().upper())\" 2>/dev/null || echo \"no python in bash\"", "write_file=verify_sha256.py", "bash=python3 verify_sha256.py", "write_file=debug_sha256.py", "bash=python3 debug_sha256.py", "bash=python3 -c \"\n# Compare our sha256 round 0 with standard\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\ndef ch(x,y,z): return (x&y)^((~x&0xFFFFFFFF)&z)\ndef maj(x,y,z): return (x&y)^(x&z)^(y&z)\ndef sigma0(x): return rotr(x,2)^rotr(x,13)^rotr(x,22)\ndef sigma1(x): return rotr(x,6)^rotr(x,11)^rotr(x,25)\n\n# Standard test vectors for SHA-256 round 0 of 'abc'\na=0x6a09e667; b=0xbb67ae85; c=0x3c6ef372; d=0xa54ff53a\ne=0x510e527f; f=0x9b05688c; g=0x1f83d9ab; h=0x5be0cd19\nK0=0x428a2f98; W0=0x61626380\n\n# Our computation\ns1_e = sigma1(e)\nch_efg = ch(e,f,g)\nt1_ours = (h + s1_e + ch_efg + K0 + W0) & 0xFFFFFFFF\ns0_a = sigma0(a)\nmaj_abc = maj(a,b,c)\nt2_ours = (s0_a + maj_abc) & 0xFFFFFFFF\n\nprint(f'sigma1(e) = {s1_e:08X}')\nprint(f'ch(e,f,g)  = {ch_efg:08X}')\nprint(f'T1 ours    = {t1_ours:08X}')\nprint(f'sigma0(a) = {s0_a:08X}')\nprint(f'maj(a,b,c) = {maj_abc:08X}')\nprint(f'T2 ours    = {t2_ours:08X}')\n\n# Expected values from NIST test vectors\n# SHA-256('abc') intermediate values are well-known\nprint()\nprint('Expected (from FIPS 180-4):')\n# Let's compute with hashlib internals - actually we can't\n# Let me instead search for known values\n\n# Actually let me just verify rotr\nprint(f'ROTR(6) of e: direct={(e>>6)|((e&0x3F)<<26):08X}')\nprint(f'ROTR(11) of e: direct={(e>>11)|((e&0x7FF)<<21):08X}')\nprint(f'ROTR(25) of e: direct={(e>>25)|((e&0x1FFFFFF)<<7):08X}')\n\n# Verify sigma1 manually\nv6 = (e>>6)|((e&0x3F)<<26)\nv11 = (e>>11)|((e&0x7FF)<<21)\nv25 = (e>>25)|((e&0x1FFFFFF)<<7)\nprint(f'sigma1 manual: {v6^v11^v25:08X}')\nprint(f'sigma1 func:   {sigma1(e):08X}')\n\"", "bash=python3 -c \"\n# Use the EXACT same code but check final state vs expected\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\ndef ch(x,y,z): return (x&y)^((~x&0xFFFFFFFF)&z)\ndef maj(x,y,z): return (x&y)^(x&z)^(y&z)\ndef sigma0(x): return rotr(x,2)^rotr(x,13)^rotr(x,22)\ndef sigma1(x): return rotr(x,6)^rotr(x,11)^rotr(x,25)\ndef gamma0(x): return rotr(x,7)^rotr(x,18)^(x>>3)\ndef gamma1(x): return rotr(x,17)^rotr(x,19)^(x>>10)\n\nK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n     0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n     0x49b40821,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,\n     0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,\n     0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,\n     0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,\n     0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,\n     0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7]\n\nimport struct\nmsg = b'abc\\x80' + b'\\x00'*(64-3-1-8) + struct.pack('>Q', 24)\nblock = bytearray(msg)\n\nw = [0]*64\nfor j in range(16):\n    w[j] = (block[j*4]<<24)|(block[j*4+1]<<16)|(block[j*4+2]<<8)|block[j*4+3]\nfor j in range(16,64):\n    w[j] = (gamma1(w[j-2]) + w[j-7] + gamma0(w[j-15]) + w[j-16]) & 0xFFFFFFFF\n\nH0 = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]\na,b,c,d,e,f,g,h = H0\n\n# Print every 16 rounds of state\nfor j in range(64):\n    t1 = (h + sigma1(e) + ch(e,f,g) + K[j] + w[j]) & 0xFFFFFFFF\n    t2 = (sigma0(a) + maj(a,b,c)) & 0xFFFFFFFF\n    h=g; g=f; f=e; e=(d+t1)&0xFFFFFFFF\n    d=c; c=b; b=a; a=(t1+t2)&0xFFFFFFFF\n    if j in [0, 15, 16, 31, 32, 47, 48, 63]:\n        print(f'Round {j:2d}: a={a:08X} b={b:08X} c={c:08X} d={d:08X} e={e:08X} f={f:08X} g={g:08X} h={h:08X}')\n\nfinal = [(H0[i]+v)&0xFFFFFFFF for i,v in enumerate([a,b,c,d,e,f,g,h])]\nprint(f'\\\\nFinal state: {\\\" \\\".join(f\\\"{x:08X}\\\" for x in final)}')\nprint(f'Expected:     BA7816BF 8F01CFEA 414140DE 5DAE2223 B00361A3 96177A9C B410FF61 F20015AD')\n\"", "bash=python3 << 'PYEOF'\n# Compare our implementation against a reference, find first divergent round\nimport struct, hashlib\n\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\ndef ch(x,y,z): return (x&y)^((~x&0xFFFFFFFF)&z)\ndef maj(x,y,z): return (x&y)^(x&z)^(y&z)\ndef sigma0(x): return rotr(x,2)^rotr(x,13)^rotr(x,22)\ndef sigma1(x): return rotr(x,6)^rotr(x,11)^rotr(x,25)\ndef gamma0(x): return rotr(x,7)^rotr(x,18)^(x>>3)\ndef gamma1(x): return rotr(x,17)^rotr(x,19)^(x>>10)\n\nK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n     0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n     0x49b40821,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,\n     0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,\n     0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,\n     0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,\n     0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,\n     0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7]\n\n# Reference: use PyCryptodome or a known-good implementation\n# Let's use the algorithm from RFC 6234 with standard test vectors\n# Actually let me check the W values against a known reference\n\nmsg = b'abc\\x80' + b'\\x00'*(64-3-1-8) + struct.pack('>Q', 24)\nblock = bytearray(msg)\n\nw = [0]*64\nfor j in range(16):\n    w[j] = (block[j*4]<<24)|(block[j*4+1]<<16)|(block[j*4+2]<<8)|block[j*4+3]\nfor j in range(16,64):\n    w[j] = (gamma1(w[j-2]) + w[j-7] + gamma0(w[j-15]) + w[j-16]) & 0xFFFFFFFF\n\n# Verify against known W values for \"abc\"\n# From https://sha256algorithm.com/ or similar reference\nprint(\"W[0]  =\", hex(w[0]),  \"expected 0x61626380\")\nprint(\"W[1]  =\", hex(w[1]),  \"expected 0x0\")\nprint(\"W[15] =\", hex(w[15]), \"expected 0x18\")\nprint(\"W[16] =\", hex(w[16]), \"expected ?\")  # This should be computed by expansion\n\n# Let me check if there's a reference: gamma0(0) = ?\n# gamma0(0) = rotr(0,7) ^ rotr(0,18) ^ (0>>3) = 0\n# gamma1(0) = rotr(0,17) ^ rotr(0,19) ^ (0>>10) = 0\n# So W[16] = gamma1(W[14]) + W[9] + gamma0(W[1]) + W[0]\n# W[14]=0, W[9]=0, W[1]=0\n# W[16] = gamma1(0) + 0 + gamma0(0) + 0x61626380 = 0x61626380\nprint(\"W[16] computed:\", hex(w[16]), \"expected 0x61626380\")\n\n# W[17] = gamma1(W[15]) + W[10] + gamma0(W[2]) + W[1]\n# W[15]=0x18, W[10]=0, W[2]=0, W[1]=0\n# gamma1(0x18) = rotr(0x18,17) ^ rotr(0x18,19) ^ (0x18>>10)\n# = (0x18>>17 | 0x18<<15) ^ (0x18>>19 | 0x18<<13) ^ 0\n# 0x18<<15 = 0xC0000, 0x18>>17=0 → 0xC0000\n# 0x18<<13 = 0x30000, 0x18>>19=0 → 0x30000\n# gamma1 = 0xC0000 ^ 0x30000 = 0xF0000\n# W[17] = 0xF0000 + 0 + 0 + 0 = 0xF0000\n\ng1_18 = rotr(0x18,17) ^ rotr(0x18,19) ^ (0x18>>10)\nprint(f\"gamma1(0x18) = {g1_18:08X}, expected 0x000F0000\")\n\nw17_manual = g1_18 & 0xFFFFFFFF\nprint(f\"W[17] computed: {w[17]:08X}, manual: {w17_manual:08X}\")\n\n# Now check the actual Python integer for rotr\nprint(f\"\\nrotr(0x18,17) = {rotr(0x18,17):08X}\")\nprint(f\"0x18<<15 = {0x18<<15:08X}\")\nprint(f\"(0x18>>17) | (0x18<<15) = {(0x18>>17) | (0x18<<15):08X}\")\n\n# Check: is rotr(0x18,17) giving the right result?\n# Standard: ROTR(0x00000018, 17) = 0x0000C000\nx = 0x18\nexpected_rotr = ((x >> 17) | (x << 15)) & 0xFFFFFFFF\nprint(f\"Expected rotr(0x18,17) = {expected_rotr:08X}\")\nprint(f\"My rotr(0x18,17) = {rotr(0x18,17):08X}\")\nprint(f\"Match: {expected_rotr == rotr(0x18,17)}\")\nPYEOF", "bash=python3 << 'PYEOF'\n# Reference SHA256 implementation vs ours - find first divergent state value\nimport struct\n\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\n\n# --- REFERENCE IMPLEMENTATION (from Wikipedia/NIST, known correct) ---\n# This uses a different internal structure to avoid any shared-bug issues\ndef sha256_ref(data):\n    # Standard SHA-256 per FIPS 180-4\n    h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,\n         0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]\n    k = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n         0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n         0x49b40821,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,\n         0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,\n         0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,\n         0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,\n         0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,