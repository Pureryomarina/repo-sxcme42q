, "bash=python3 -c \"\ne=0x510E527F; g=0x1F83D9AB\nr1 = (~e) & g\nr2 = (~e & 0xFFFFFFFF) & g\nr3 = (e ^ 0xFFFFFFFF) & g  # alternative: XOR with mask\nprint(f'(~e) & g           = {r1:08X}')\nprint(f'(~e & 0xFFFFFFFF) & g = {r2:08X}')\nprint(f'(e ^ 0xFFFFFFFF) & g  = {r3:08X}')\nprint(f'Are r1==r2? {r1==r2}, r2==r3? {r2==r3}')\n# Compare with C: ~0x510E527F = 0xAEF1AD80, then & 0x1F83D9AB = ?\nprint(f'C equivalent would be: {0xAEF1AD80 & 0x1F83D9AB:08X}')\n\"", "bash=python3 -c \"\n# Feed our padded block through Python's hashlib to verify padding is correct\nimport hashlib, struct\n\n# Our padded block\nmsg = b'abc\\x80' + b'\\x00'*(64-3-1-8) + struct.pack('>Q', 24)\nprint(f'Our padded block ({len(msg)} bytes): {msg.hex()}')\n\n# Standard padded block (using hashlib internally would produce same)\n# Let's verify by comparing with a known reference padded block\n# Actually hashlib doesn't expose internal padding\n\n# Let's try: create a SHA256 object and feed the padded block\n# as a PRE-PADDED message (length=64). This should give same as sha256('abc')\n# if our padding matches.\nh = hashlib.sha256()\n# We can't feed pre-padded message to hashlib because it adds its own padding\n# Instead, let's use a custom SHA256 that processes raw blocks\n\n# Let me just try: what does the correct sha256 transform produce for our block?\n# I need a sha256 implementation that lets me process raw blocks\n# Simple approach: implement SHA256 compression-only (no padding) and compare\n\n# Let me check if the issue is with the K constants\n# These should be the first 32 bits of the fractional parts of the cube roots of the first 64 primes\n# Let me verify K[0] = 0x428a2f98\nimport math\nk0 = int(2**32 * (2**(1/3) % 1))\nprint(f'K[0] should be: 0x{k0:08X}')\n\n# K[1] should be from cube root of 3:\nk1 = int(2**32 * (3**(1/3) % 1))\nprint(f'K[1] should be: 0x{k1:08X}')\n\n# Check K[63]\nk63 = int(2**32 * (311**(1/3) % 1))\nprint(f'K[63] should be: 0x{k63:08X}')\n\"", "bash=python3 -c \"