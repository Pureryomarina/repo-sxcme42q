off:#x} phentsz={e_phentsz} phnum={e_phnum}')\n    for i in range(e_phnum):\n        off = e_phoff + i * e_phentsz\n        p_type = struct.unpack_from('<I', data, off)[0]\n        if p_type != 1: continue\n        p_flags  = struct.unpack_from('<I', data, off+4)[0]\n        p_offset = struct.unpack_from('<Q', data, off+8)[0]\n        p_filesz = struct.unpack_from('<Q', data, off+0x20)[0]\n        p_memsz  = struct.unpack_from('<Q', data, off+0x28)[0]\n        fs = ''.join(c if p_flags&(1<<j) else '-' for j,c in enumerate('XWR'))\n        print(f'  LOAD[{i}]: {fs} off={p_offset:#x} fsz={p_filesz:#x} msz={p_memsz:#x}')\n        if p_flags & 1:\n            cl = (p_filesz*90)//100\n            tc = crc32(data[p_offset:p_offset+cl])\n            print(f'    TEXT CRC(90%={cl:#x}) = 0x{tc:08X}')\n            return (p_offset, p_filesz)\n    return None\n\nwith open(r'D:\\fenxiwanjian\\过检加解密\\完整修复\\libs\\arm64-v8a\\safe_bypass', 'rb') as f:\n    data = f.read()\nprint(f'File: {len(data)} bytes')\nfind_text_section(data)\n\"", "write_file=debug_elf.py", "delete_range=.", "write_file=DEFENSE.md", "write_file=Protect/SeccompGuard.h", "edit_file=Protect/SeccompGuard.h", "write_file=Protect/InlineHookDetect.h", "edit_file=Protect/AntiDump.h", "edit_file=Protect/RootKitDetect.h", "bash=rm -f debug_elf.py nul", "bash=rm -rf tmp", "bash=rm -rf ProtectKit_Optimized", "bash=rm -f Protect/IntegrityCheck.h.bak", "multi_edit=src/utils/integrity_sha256.cpp", "multi_edit=src/main.cpp"]
