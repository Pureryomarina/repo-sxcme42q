s C++ hmac_sha256, step by step\nkey = bytes([0x4B,0x8E,0x2D,0x7F,0x1A,0x6C,0x93,0xE4,0xB5,0x0F,0x38,0xD2,0x66,0xC9,0x5A,0x81,0xFD,0x3E,0x47,0x9B,0x0C,0x78,0xA5,0xD3,0x2E,0x6F,0x14,0x89,0xBB,0xCC,0xDD,0xEE])\n\n# C++ style: key_block = key + zeros to 64\nkey_block = bytearray(64)\nkey_block[:32] = key  # key_len=32 <= 64, so just copy\n\ni_key_pad = bytearray(64)\no_key_pad = bytearray(64)\nfor i in range(64):\n    i_key_pad[i] = key_block[i] ^ 0x36\n    o_key_pad[i] = key_block[i] ^ 0x5c\n\n# Now use our FIXED sha256 (not Python hashlib)\n# First re-implement the fixed K and rotr etc.\ndef rotr(x,n): return ((x>>n)|(x<<(32-n)))&0xFFFFFFFF\nK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,\n     0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,\n     0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,\n     0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,\n     0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,\n     0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,\n     0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,\n     0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]\n\ndef sha256_raw(data):\n    ml = len(data)*8\n    msg = bytearray(data)\n    msg.append(0x80)\n    while (len(msg)%64)!=56: msg.append(0)\n    msg += struct.pack('>Q', ml)\n    h = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]\n    for bi in range(0,len(msg),64):\n        blk=msg[bi:bi+64]; w=[0]*64\n        for t in range(16): w[t]=(blk[t*4]<<24)|(blk[t*4+1]<<16)|(blk[t*4+2]<<8)|blk[t*4+3]\n        for t in range(16,64):\n            s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>3)\n            s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>10)\n            w[t]=(w[t-16]+s0+w[t-7]+s1)&0xFFFFFFFF\n        a,b,c,d,e,f,g,hh = h\n        for t in range(64):\n            S1=rotr(e,6)^rotr(e,11)^rotr(e,25); ch_v=(e&f)^((~e)&g)\n            t1=(hh+S1+ch_v+K[t]+w[t])&0xFFFFFFFF\n            S0=rotr(a,2)^rotr(a,13)^rotr(a,22); maj_v=(a&b)^(a&c)^(b&c)\n            t2=(S0+maj_v)&0xFFFFFFFF\n            hh=g;g=f;f=e;e=(d+t1)&0xFFFFFFFF\n            d=c;c=b;b=a;a=(t1+t2)&0xFFFFFFFF\n        h[0]=(h[0]+a)&0xFFFFFFFF; h[1]=(h[1]+b)&0xFFFFFFFF; h[2]=(h[2]+c)&0xFFFFFFFF; h[3]=(h[3]+d)&0xFFFFFFFF\n        h[4]=(h[4]+e)&0xFFFFFFFF; h[5]=(h[5]+f)&0xFFFFFFFF; h[6]=(h[6]+g)&0xFFFFFFFF; h[7]=(h[7]+hh)&0xFFFFFFFF\n    return b''.join(struct.pack('>I', x) for x in h)\n\n# Step 1: inner = SHA256(i_key_pad || \"cross_check_integrity_sha256\")\ninner = sha256_raw(bytes(i_key_pad) + b'cross_check_integrity_sha256')\nprint(f'Inner (our algo): {inner.hex().upper()}')\n\n# Python's own sha256 for comparison\ninner_std = hashlib.sha256(bytes(i_key_pad) + b'cross_check_integrity_sha256').digest()\nprint(f'Inner (hashlib):  {inner_std.hex().upper()}')\nprint(f'Inner match: {inner == inner_std}')\n\n# Step 2: outer = SHA256(o_key_pad || inner)\nouter = sha256_raw(bytes(o_key_pad) + inner)\nprint(f'\\nOuter (our algo): {outer.hex().upper()}')\nprint(f'Python HMAC ref:   {hmac.new(key, b\"cross_check_integrity_sha256\", hashlib.sha256).digest().hex().upper()}')\nprint(f'Outer match: {outer.hex().upper() == \"576998C21F1A26803E66F3D4ACCEE0D71D257F1A10BBF5A858D2B1D7F17703BE\"}')\nPYEOF", "bash=/usr/bin/python3 -c \"print(len(b'cross_check_integrity_sha256'))\"", "bash=/usr/bin/python3 -c \"\nimport struct\n\ndef find_text_section(data: bytes):\n    if data[:4] != b'\\x7fELF' or data[4] != 2:\n        return None\n    e_phoff,   = struct.unpack_from('<Q', data, 0x20)\n    e_phentsz, = struct.unpack_from('<H', data, 0x36)\n    e_phnum,   = struct.unpack_from('<H', data, 0x38)\n    print(f'ELF header: phoff={e_phoff:#x} phentsz={e_phentsz} phnum